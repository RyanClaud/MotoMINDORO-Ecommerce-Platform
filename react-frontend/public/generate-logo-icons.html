<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons from Logo - MotoMINDORO</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 { 
            color: #333; 
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        .logo-preview {
            margin: 2rem 0;
            padding: 2rem;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 1rem;
        }
        .logo-preview img {
            max-width: 200px;
            height: auto;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .status { 
            margin: 1.5rem 0; 
            color: #666;
            font-size: 1.1rem;
            min-height: 60px;
        }
        .success { 
            color: #10b981; 
            font-weight: bold;
        }
        .error {
            color: #ef4444;
            font-weight: bold;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        .preview-item {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
        }
        .preview-item canvas {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .preview-item p {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #6b7280;
            font-weight: 600;
        }
        canvas { display: none; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏍️ MotoMINDORO PWA Icons</h1>
        
        <div class="logo-preview">
            <img src="/motomindoro_logo.png" alt="MotoMindoro Logo" id="logoPreview">
        </div>
        
        <div class="status" id="status">Ready to generate PWA icons from your logo...</div>
        
        <button class="btn" onclick="generateIcons()" id="generateBtn">
            Generate PWA Icons
        </button>
        
        <div class="preview-grid" id="previewGrid" style="display: none;">
            <div class="preview-item">
                <canvas id="preview192" width="192" height="192"></canvas>
                <p>192x192</p>
            </div>
            <div class="preview-item">
                <canvas id="preview512" width="512" height="512"></canvas>
                <p>512x512</p>
            </div>
        </div>
    </div>

    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>

    <script>
        function generateIcon(size, canvasId, previewCanvasId) {
            return new Promise((resolve, reject) => {
                const canvas = document.getElementById(canvasId);
                const ctx = canvas.getContext('2d');
                const previewCanvas = document.getElementById(previewCanvasId);
                const previewCtx = previewCanvas.getContext('2d');

                // Load the logo image
                const img = new Image();
                img.crossOrigin = "anonymous";
                
                img.onload = function() {
                    // Clear canvas
                    ctx.clearRect(0, 0, size, size);
                    previewCtx.clearRect(0, 0, size, size);
                    
                    // Calculate scaling to fit the logo nicely with some padding
                    const padding = size * 0.05; // 5% padding
                    const availableSize = size - (padding * 2);
                    const scale = Math.min(availableSize / img.width, availableSize / img.height);
                    const scaledWidth = img.width * scale;
                    const scaledHeight = img.height * scale;
                    const x = (size - scaledWidth) / 2;
                    const y = (size - scaledHeight) / 2;
                    
                    // Draw on both canvases
                    ctx.drawImage(img, x, y, scaledWidth, scaledHeight);
                    previewCtx.drawImage(img, x, y, scaledWidth, scaledHeight);
                    
                    resolve(canvas);
                };
                
                img.onerror = function() {
                    reject(new Error('Failed to load logo image'));
                };
                
                img.src = '/motomindoro_logo.png';
            });
        }

        function downloadCanvas(canvas, filename) {
            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    setTimeout(resolve, 100);
                }, 'image/png');
            });
        }

        async function generateIcons() {
            const status = document.getElementById('status');
            const btn = document.getElementById('generateBtn');
            const previewGrid = document.getElementById('previewGrid');
            
            btn.disabled = true;
            status.className = 'status';
            
            try {
                // Generate 192x192
                status.textContent = 'Generating 192x192 icon...';
                const canvas192 = await generateIcon(192, 'canvas192', 'preview192');
                await downloadCanvas(canvas192, 'pwa-192x192.png');
                
                // Wait a bit
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Generate 512x512
                status.textContent = 'Generating 512x512 icon...';
                const canvas512 = await generateIcon(512, 'canvas512', 'preview512');
                await downloadCanvas(canvas512, 'pwa-512x512.png');
                
                // Show previews
                previewGrid.style.display = 'grid';
                
                // Success
                status.className = 'status success';
                status.innerHTML = `
                    <div style="font-size: 3rem; margin-bottom: 1rem;">✓</div>
                    <div style="font-size: 1.2rem; margin-bottom: 0.5rem;">Icons Generated Successfully!</div>
                    <div style="font-size: 0.9rem; color: #666; font-weight: normal;">
                        Check your downloads folder for:<br>
                        <strong>pwa-192x192.png</strong> and <strong>pwa-512x512.png</strong>
                    </div>
                `;
                
                // Add instructions after a moment
                setTimeout(() => {
                    status.innerHTML += `
                        <div style="margin-top: 1.5rem; padding: 1rem; background: #eff6ff; border-radius: 0.5rem; text-align: left;">
                            <strong style="color: #1e40af;">Next Steps:</strong><br>
                            <ol style="margin: 0.5rem 0 0 1.5rem; color: #374151;">
                                <li>Move both PNG files to: <code style="background: #dbeafe; padding: 0.2rem 0.4rem; border-radius: 0.25rem;">react-frontend/public/</code></li>
                                <li>Update your manifest.json (if needed)</li>
                                <li>Restart your dev server</li>
                                <li>Your PWA is now ready to install! 🎉</li>
                            </ol>
                        </div>
                    `;
                }, 1000);
                
            } catch (error) {
                status.className = 'status error';
                status.textContent = '❌ Error: ' + error.message;
                console.error('Error generating icons:', error);
            } finally {
                btn.disabled = false;
            }
        }

        // Check if logo exists on load
        window.addEventListener('load', () => {
            const img = document.getElementById('logoPreview');
            img.onerror = () => {
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = '❌ Logo not found! Make sure motomindoro_logo.png exists in the public folder.';
                document.getElementById('generateBtn').disabled = true;
            };
        });
    </script>
</body>
</html>
