<!DOCTYPE html>
<html>
<head>
    <title>SVG to PNG Converter</title>
</head>
<body>
    <h1>Converting SVG to PNG...</h1>
    <canvas id="canvas192" width="192" height="192" style="display:none;"></canvas>
    <canvas id="canvas512" width="512" height="512" style="display:none;"></canvas>
    
    <script>
        function convertSVGtoPNG(svgContent, size, filename) {
            const canvas = document.getElementById(`canvas${size}`);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            };
            
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            img.src = url;
        }

        // SVG content for 192x192
        const svg192 = `<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#grad1)" rx="32"/>
  <text x="96" y="110" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">MM</text>
  <text x="96" y="150" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">MotoMINDORO</text>
</svg>`;

        // SVG content for 512x512
        const svg512 = `<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#grad2)" rx="85"/>
  <text x="256" y="300" font-family="Arial, sans-serif" font-size="220" font-weight="bold" fill="white" text-anchor="middle">MM</text>
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" opacity="0.9">MotoMINDORO</text>
</svg>`;

        // Convert both
        setTimeout(() => {
            convertSVGtoPNG(svg192, 192, 'pwa-192x192.png');
            setTimeout(() => {
                convertSVGtoPNG(svg512, 512, 'pwa-512x512.png');
                document.body.innerHTML += '<p style="color: green; font-size: 20px; margin-top: 20px;">✓ Icons downloaded! Place them in the public folder.</p>';
            }, 500);
        }, 100);
    </script>
</body>
</html>
